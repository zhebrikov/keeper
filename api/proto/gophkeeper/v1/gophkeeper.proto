syntax = "proto3";

package gophkeeper.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/zhebrikov/gophkeeper/api/gen/gophkeeper/v1;gophkeeperv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "GophKeeper API";
    version: "1.0";
    description: "Secure password manager with client-side encryption.";
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "JWT access token. Format: Bearer {token}";
      }
    }
  };
};

// GophKeeper provides secure storage and synchronization of private data.
service GophKeeper {
  // Register creates a new user account.
  rpc Register(RegisterRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }
  // Login authenticates an existing user.
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  // RefreshToken issues a new access token using a refresh token.
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  // CreateSecret stores a new encrypted secret.
  rpc CreateSecret(CreateSecretRequest) returns (SecretResponse) {
    option (google.api.http) = {
      post: "/api/v1/secrets"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
  // UpdateSecret updates an existing secret with optimistic locking.
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretResponse) {
    option (google.api.http) = {
      put: "/api/v1/secrets/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
  // GetSecret returns a single secret by ID.
  rpc GetSecret(GetSecretRequest) returns (SecretResponse) {
    option (google.api.http) = {
      get: "/api/v1/secrets/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
  // ListSecrets returns secrets optionally filtered by update time.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {
      get: "/api/v1/secrets"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
  // DeleteSecret marks a secret as deleted.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {
      delete: "/api/v1/secrets/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
  // Sync returns all secrets changed since the given timestamp.
  rpc Sync(SyncRequest) returns (SyncResponse) {
    option (google.api.http) = {
      post: "/api/v1/sync"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer";
          value: {}
        }
      }
    };
  }
}

// SecretType identifies the kind of stored data.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_CREDENTIAL = 1;
  SECRET_TYPE_TEXT = 2;
  SECRET_TYPE_BINARY = 3;
  SECRET_TYPE_CARD = 4;
  SECRET_TYPE_OTP = 5;
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
}

message CreateSecretRequest {
  SecretType type = 1;
  string name = 2;
  bytes encrypted_data = 3;
  string metadata = 4;
}

message UpdateSecretRequest {
  string id = 1;
  string name = 2;
  bytes encrypted_data = 3;
  string metadata = 4;
  int64 version = 5;
}

message GetSecretRequest {
  string id = 1;
}

message ListSecretsRequest {
  int64 updated_since = 1;
}

message DeleteSecretRequest {
  string id = 1;
}

message SecretResponse {
  string id = 1;
  SecretType type = 2;
  string name = 3;
  bytes encrypted_data = 4;
  string metadata = 5;
  int64 version = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  bool deleted = 9;
}

message ListSecretsResponse {
  repeated SecretResponse secrets = 1;
}

message DeleteSecretResponse {}

message SyncRequest {
  int64 last_sync_at = 1;
}

message SyncResponse {
  repeated SecretResponse secrets = 1;
  int64 sync_at = 2;
}
